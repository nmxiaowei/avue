<!DOCTYPE html>
<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../../cdn/axios/axios.js"></script>
    <script src="../../cdn/vue/vue.global.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <script src="../../cdn/element-plus/icons-vue.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/avue.js"></script>
  </head>
  <body>
    <div id="app" style="max-width: 700px; padding: 24px">
      <p>右键列表项打开菜单；菜单会自动避开屏幕边缘，可按 Esc 关闭，并支持方向键选择。</p>
      <el-switch v-model="disabled" active-text="禁用右键菜单"></el-switch>
      <el-table :data="list" style="margin-top: 16px">
        <el-table-column prop="name" label="姓名">
          <template #default="{ row }">
            <span
              v-contextmenu="{
                id: 'user-contextmenu',
                value: row,
                disabled,
                event: beforeOpen,
                hide: handleHide
              }"
            >{{ row.name }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="role" label="角色"></el-table-column>
      </el-table>
      <ul id="user-contextmenu">
        <li @click="handleAction('查看')">查看资料</li>
        <li @click="handleAction('编辑')">编辑用户</li>
        <li>
          更多操作
          <ul>
            <li @click="handleAction('复制名称')">复制名称</li>
            <li @click="handleAction('导出')">导出信息</li>
          </ul>
        </li>
        <li class="el-dropdown-menu__item--divided" @click="handleAction('删除')">删除</li>
      </ul>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          disabled: false,
          current: null,
          list: [
            { id: 'user-1', name: '张三', role: '管理员' },
            { id: 'user-2', name: '李四', role: '运营' },
            { id: 'user-3', name: '王五', role: '访客' },
          ],
        };
      },
      methods: {
        beforeOpen(row, done) {
          this.current = row;
          done();
        },
        handleHide(row, event, reason) {
          console.log('菜单关闭', row, reason, event.type);
        },
        handleAction(action) {
          this.$message.success(`${action}：${this.current.name}`);
        },
      },
    });
    app.use(ElementPlus);
    app.use(AVUE);
    app.mount('#app');
  </script>
</html>
