<!DOCTYPE html>
<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avue Clipboard</title>
    <script src="../../cdn/axios/axios.js"></script>
    <script src="../../cdn/vue/vue.global.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/avue.js"></script>
    <style>
      body { margin: 0; padding: 24px; background: #f5f7fa; font-family: Arial, "Microsoft YaHei", sans-serif; }
      #app { max-width: 680px; margin: 0 auto; padding: 22px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgb(15 23 42 / 6%); }
      .status { margin-top: 12px; color: #909399; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app">
      <el-input v-model="text" type="textarea" :rows="5" show-word-limit maxlength="500" placeholder="输入要复制的内容"></el-input>
      <p>
        <el-button type="primary" :loading="copying" @click="copyText">复制内容</el-button>
        <el-button @click="text = ''">清空</el-button>
        <el-button text @click="copyDemo">复制示例文本</el-button>
      </p>
      <p class="status">{{ status }}</p>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() { return { text: "", copying: false, status: "优先使用系统 Clipboard API，失败时自动降级。" }; },
      methods: {
        async copy(value) {
          this.copying = true;
          try {
            await this.$Clipboard({ text: value });
            this.status = "已复制 " + String(value).length + " 个字符";
            this.$message.success("复制成功");
          } catch (error) {
            this.status = error.message || "复制失败";
            this.$message.error(this.status);
          } finally { this.copying = false; }
        },
        copyText() { this.copy(this.text); },
        copyDemo() { this.copy("测试：复制至剪切板的文本"); },
      },
    });
    app.use(ElementPlus);
    app.use(AVUE);
    app.mount("#app");
  </script>
</html>
