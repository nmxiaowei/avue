<!DOCTYPE html>
<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../../cdn/axios/axios.js"></script>
    <script src="../../cdn/vue/vue.global.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <script src="../../cdn/element-plus/icons-vue.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/avue.js"></script>
  </head>
  <body>
    <div id="app" style="max-width: 760px; padding: 24px">
      <avue-comment :option="option" :data="comment" @avatar-click="handleAvatar">
        <el-button text type="primary" size="small" @click="$message('已回复')">回复</el-button>
      </avue-comment>
      <avue-comment :option="option" :data="commentWithoutAvatar" reverse>
        <template #actions>
          <el-button text size="small">赞</el-button>
        </template>
        <template #footer>
          <span style="font-size: 12px; color: #909399">来自 Avue 示例</span>
        </template>
      </avue-comment>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          option: {
            props: { avatar: 'head', author: 'userName', body: 'content', time: 'createdAt' },
          },
          comment: {
            head: 'https://avatar.gitee.com/uploads/61/632261_smallweigit.jpg!avatar100?1518660401',
            userName: '某人',
            createdAt: '刚刚',
            content: '<p>这是一条支持 <strong>富文本</strong> 的评论。</p><blockquote>引用内容会保持清晰的层级。</blockquote>',
          },
          commentWithoutAvatar: {
            userName: '访客',
            createdAt: '2 分钟前',
            content: '<p>未提供头像时显示姓名首字母，也支持反向布局。</p>',
          },
        };
      },
      methods: {
        handleAvatar(data) {
          this.$message.success(`点击了 ${data.userName} 的头像`);
        },
      },
    });
    app.use(ElementPlus);
    app.use(AVUE);
    app.mount('#app');
  </script>
</html>
