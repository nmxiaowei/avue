<!doctype html>
<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>CRUD Column State</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../../cdn/vue/vue.global.min.js"></script>
    <script src="../../cdn/sortable/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <script src="../../cdn/element-plus/icons-vue.js"></script>
    <script src="../../cdn/element-plus/locale/zh-cn.min.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/avue.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #f5f7fb;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }
      .demo-wrap {
        padding: 16px;
        border: 1px solid #dfe5ef;
        background: #fff;
      }
      .demo-bar {
        margin-bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .state-box {
        margin-top: 12px;
        padding: 12px;
        overflow: auto;
        color: #e5e7eb;
        background: #111827;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app" class="demo-wrap">
      <div class="demo-bar">
        <el-button
          type="primary"
          @click="$refs.crud.$refs.dialogColumn.handleShow()"
          >列设置</el-button
        >
        <el-button @click="resetColumnState">重置列设置</el-button>
        <el-button @click="reload">模拟刷新页面</el-button>
        <span>存储 key：{{ option.columnStateKey }}</span>
      </div>
      <avue-crud
        ref="crud"
        v-model="form"
        v-model:page="page"
        :option="option"
        :data="data"
        @column-state-change="handleColumnStateChange"
        @column-state-reset="handleColumnStateReset"
      ></avue-crud>
      <pre class="state-box">{{ stateText }}</pre>
    </div>
    <script>
      const stateKey = "crud-column-state-demo";
      const app = Vue.createApp({
        data() {
          return {
            form: {},
            page: {
              total: 4,
              currentPage: 1,
              pageSize: 10,
            },
            stateText: "",
            option: {
              columnStateKey: stateKey,
              border: true,
              stripe: true,
              index: true,
              selection: true,
              columnBtn: true,
              align: "center",
              menuWidth: 180,
              column: [
                {
                  label: "姓名",
                  prop: "name",
                  width: 120,
                  search: true,
                  rules: [
                    { required: true, message: "请输入姓名", trigger: "blur" },
                  ],
                },
                {
                  label: "部门",
                  prop: "dept",
                  width: 140,
                  type: "select",
                  dicData: [
                    { label: "研发部", value: "dev" },
                    { label: "产品部", value: "product" },
                    { label: "运营部", value: "ops" },
                  ],
                },
                {
                  label: "岗位",
                  prop: "post",
                  width: 140,
                },
                {
                  label: "状态",
                  prop: "status",
                  type: "radio",
                  width: 120,
                  dicData: [
                    { label: "启用", value: 1 },
                    { label: "禁用", value: 0 },
                  ],
                },
                {
                  label: "创建时间",
                  prop: "createTime",
                  width: 170,
                  type: "datetime",
                },
                {
                  label: "备注",
                  prop: "remark",
                  minWidth: 180,
                  overHidden: true,
                },
              ],
            },
            data: [
              {
                id: 1,
                name: "张三",
                dept: "dev",
                post: "前端工程师",
                status: 1,
                createTime: "2026-06-01 09:00:00",
                remark: "可在列设置中隐藏或拖拽本列",
              },
              {
                id: 2,
                name: "李四",
                dept: "product",
                post: "产品经理",
                status: 1,
                createTime: "2026-06-02 10:30:00",
                remark: "调整列宽后会写入 localStorage",
              },
              {
                id: 3,
                name: "王五",
                dept: "ops",
                post: "运营专员",
                status: 0,
                createTime: "2026-06-03 14:20:00",
                remark: "刷新页面后恢复列顺序和显隐",
              },
              {
                id: 4,
                name: "赵六",
                dept: "dev",
                post: "测试工程师",
                status: 1,
                createTime: "2026-06-04 16:45:00",
                remark: "点击重置会清理当前 key 的列状态",
              },
            ],
          };
        },
        mounted() {
          this.readState();
        },
        methods: {
          getStorageKey() {
            return "AVUE_COLUMN_STATE:" + stateKey;
          },
          readState() {
            this.stateText =
              localStorage.getItem(this.getStorageKey()) || "暂无持久化数据";
          },
          handleColumnStateChange(state, reason) {
            this.stateText = JSON.stringify({ reason, state }, null, 2);
          },
          handleColumnStateReset() {
            this.readState();
          },
          resetColumnState() {
            this.$refs.crud.resetColumnState(() => {
              this.readState();
              this.$message.success("列设置已重置并刷新状态");
            });
          },
          reload() {
            location.reload();
          },
        },
      });
      app.use(ElementPlus);
      app.use(AVUE);
      app.mount("#app");
    </script>
  </body>
</html>
