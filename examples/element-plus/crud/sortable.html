<!DOCTYPE html>

<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="../../cdn/axios/axios.js"></script>

    <script src="../../cdn/vue/vue.global.min.js"></script>
    <!-- 导入拖拽需要的包 -->
    <script src="../../cdn/sortable/Sortable.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <script src="../../cdn/element-plus/icons-vue.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/avue.js"></script>
  </head>

  <body>
    <div id="app">
      <p>在未启用前端筛选、列排序或展开行的平面视图中拖动行，排序结果自动同步到绑定数组。</p>
      <p>绑定数据顺序：{{ list.map(row => row.id).join(', ') }}</p>
      <p>最近回调：{{ lastSort || '尚未拖拽' }}</p>
      <el-radio-group v-model="sortMode">
        <el-radio value="auto" label="auto">自动同步</el-radio>
        <el-radio value="splice" label="splice">同步回调原地换序</el-radio>
        <el-radio value="replace" label="replace">同步回调替换数组</el-radio>
      </el-radio-group>
      <avue-crud
        :data="list"
        :option="option"
        @sortable-change="sortableChange"
      >
      </avue-crud>
    </div>
  </body>
  <script>
    var app = Vue.createApp({
      data() {
        return {
          sortMode: 'auto',
          lastSort: '',
          list: [
            {
              id: 1,
              name: "张三",
              sex: "男",
              date: "1994-02-23 00:00:00",
            },
            {
              id: 2,
              name: "李四",
              sex: "女",
              date: "1994-02-23 00:00:00",
            },
            {
              id: 3,
              name: "王五",
              sex: "女",
              date: "1994-02-23 00:00:00",
            },
            {
              id: 4,
              name: "赵六",
              sex: "男",
              date: "1994-02-23 00:00:00",
            },
          ],
          option: {
            title: "表格的标题",
            border: true,
            align: "center",
            sortable: true,
            menuAlign: "center",
            column: [
              {
                label: "姓名",
                prop: "name",
              },
              {
                label: "性别",
                prop: "sex",
              },
              {
                label: "日期",
                prop: "date",
                type: "date",
                format: "YYYY-MM-DD hh:mm:ss",
                valueFormat: "YYYY-MM-DD hh:mm:ss",
              },
            ],
          },
        };
      },
      methods: {
        /**
         * @title 排序后的回调方法
         * @param {Int} oldindex    对象老序号
         * @param {Int} newindex    对象新序号
         * @param {Object} row      移动的对象数据
         * @param {Array} list      排序后的整个对象
         * @param return
         **/
        sortableChange(oldindex, newindex, row, list) {
          this.lastSort = `${oldindex} → ${newindex}，移动 ID：${row.id}，排序结果：${list.map(item => item.id).join(', ')}`;
          if (this.sortMode === 'splice') {
            const moved = this.list.splice(oldindex, 1)[0];
            this.list.splice(newindex, 0, moved);
          } else if (this.sortMode === 'replace') {
            this.list = list;
          }
        },
      },
    });
    app.use(ElementPlus);
    app.use(AVUE);
    app.mount("#app");
  </script>
</html>
