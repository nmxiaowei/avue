<!DOCTYPE html>
<html class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avue Screenshot</title>
    <script src="../../cdn/axios/axios.js"></script>
    <script src="../../cdn/vue/vue.global.min.js"></script>
    <link rel="stylesheet" href="../../cdn/element-plus/index.css" />
    <script src="../../cdn/element-plus/index.full.min.js"></script>
    <script src="../../cdn/html2canvas/html2canvas.min.js"></script>
    <link rel="stylesheet" href="../../../dist/index.css" />
    <script src="../../../dist/avue.js"></script>
    <style>
      body { margin: 0; padding: 24px; background: #f5f7fa; font-family: Arial, "Microsoft YaHei", sans-serif; }
      #app { max-width: 760px; margin: 0 auto; }
      .card { padding: 28px; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #2563eb, #7c3aed); box-shadow: 0 12px 28px rgb(37 99 235 / 24%); }
      .preview { width: 100%; margin-top: 16px; border: 1px solid #ebeef5; border-radius: 8px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="app">
      <div ref="capture" class="card">
        <h2>截图卡片</h2>
        <p>支持将截图结果作为 Canvas 返回，或直接下载为图片文件。</p>
        <el-tag effect="dark">生成时间：{{ now }}</el-tag>
      </div>
      <p>
        <el-button type="primary" :loading="loading" @click="capture(false)">生成预览</el-button>
        <el-button :loading="loading" @click="capture(true)">下载 PNG</el-button>
      </p>
      <img v-if="preview" :src="preview" class="preview" alt="截图预览" />
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() { return { loading: false, preview: "", now: new Date().toLocaleString() }; },
      methods: {
        async capture(download) {
          this.loading = true;
          try {
            const canvas = await this.$Screenshot(this.$refs.capture, { scale: 2, backgroundColor: "#ffffff", download, filename: "avue-screenshot.png" });
            this.preview = canvas.toDataURL("image/png");
            this.$message.success(download ? "截图已下载" : "截图生成成功");
          } catch (error) {
            this.$message.error(error.message || "截图失败");
          } finally { this.loading = false; }
        },
      },
    });
    app.use(ElementPlus);
    app.use(AVUE);
    app.mount("#app");
  </script>
</html>
